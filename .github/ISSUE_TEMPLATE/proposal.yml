name: Proposal
description: A change beyond a focused fix. Open this before writing code.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today, with a concrete case.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What would change, where, and what stays the same.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How to verify it
      description: The test, measurement, or check that would show it works.
