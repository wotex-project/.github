name: Bug report
description: Something in a published repository behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version, tag, or commit you ran.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, operating system, and anything else that matters.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not a security vulnerability. Those follow SECURITY.md.
          required: true
